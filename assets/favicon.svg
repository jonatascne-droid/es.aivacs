<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: dark rounded square matching brand -->
  <rect width="100" height="100" rx="20" fill="#080C10"/>

  <!-- Subtle inner glow behind symbol -->
  <ellipse cx="50" cy="56" rx="36" ry="30" fill="rgba(75,191,239,0.07)"/>

  <!-- AIVACS triangle symbol — outline, rounded, double base -->
  <path d="M50 10 L91 78 Q93 84 87 84 L13 84 Q7 84 9 78 Z"
        stroke="#4BBFEF"
        stroke-width="6.5"
        stroke-linejoin="round"
        stroke-linecap="round"
        fill="none"/>

  <!-- First base line (overlap with triangle base) -->
  <line x1="13" y1="84" x2="87" y2="84"
        stroke="#4BBFEF"
        stroke-width="6.5"
        stroke-linecap="round"/>

  <!-- Second base line (slightly shorter, offset below) -->
  <line x1="19" y1="93" x2="81" y2="93"
        stroke="#4BBFEF"
        stroke-width="6.5"
        stroke-linecap="round"/>
</svg>
